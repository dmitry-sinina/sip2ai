name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -v ./...

      - name: Vet
        run: go vet ./...

      # sip2openai is a separate Go module; build/test/vet it on its own.
      - name: Build sip2openai
        working-directory: sip2openai
        run: go build ./...

      - name: Test sip2openai
        working-directory: sip2openai
        run: go test -race -v ./...

      - name: Vet sip2openai
        working-directory: sip2openai
        run: go vet ./...
